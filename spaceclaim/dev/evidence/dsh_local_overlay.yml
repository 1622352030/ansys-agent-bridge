# Overlay for the **local-install mode (Option B / 方式 B)** described in README.md
# and README.zh-CN.md: it replaces the bundle's MCP row with a command that launches
# the server straight out of this checkout, so the plugin boots without fetching the
# repository from GitHub on every launch (which is what hangs the desktop when the
# route to GitHub is unreliable — see TROUBLESHOOTING.md).
#
# Applied AFTER the bundle layer, and an id-targeted patch replaces the row's whole
# `config`, so every key is restated here.
- id: mcp-ansys
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: ansys
    transport: stdio
    # `uv` resolved through PATH; swap in an absolute path such as
    # 'C:/Users/<you>/.local/bin/uv.exe' if your harness does not inherit it.
    command: uv
    args:
      - 'tool'
      - 'run'
      - '--quiet'
      - '--from'
      # 注意：Python 包在 spaceclaim/ 下，不是仓库根的 python/
      - 'C:/english_path/github_fork/ansys-agent-bridge/spaceclaim/python'
      - 'ansys-bridge-mcp'
    env:
      PYTHONIOENCODING: 'utf-8'
      ANSYS_BRIDGE_LOG_LEVEL: 'WARNING'
    toolCallTimeoutMs: 900000
    failOnStartupError: false
