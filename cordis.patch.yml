# dsh bundle patch for ansys-agent-bridge.
#
# One `insert`: an MCP client layer that registers the bridge's tools under the
# `ansys` namespace. There is no absolute path anywhere in this file, so the same
# patch works on any machine and in any install location.
#
# ── Two install modes ────────────────────────────────────────────────────────
#
# A. Install from GitHub (this file as shipped). The row below launches the server
#    with `uv tool run --from git+https://…#subdirectory=spaceclaim/python`, so
#    every launch performs a `git fetch` first. Nothing to clone locally and it
#    tracks upstream — but it needs a working route to GitHub on EVERY launch.
#
# B. Install from a local checkout (recommended when the route to GitHub is
#    unreliable). Leave this file untouched and override the row from your own
#    --patch layer, replacing the `--from <git url>` argument with
#    `--from <clone>/spaceclaim/python`:
#
#      - id: mcp-ansys
#        name: '@deepseek-ai/dsh-mcp-client'
#        config:
#          serverName: ansys
#          transport: stdio
#          command: uv
#          args: [tool, run, --quiet, --from, C:/path/to/ansys-agent-bridge/spaceclaim/python, ansys-bridge-mcp]
#          env: {PYTHONIOENCODING: 'utf-8', ANSYS_BRIDGE_LOG_LEVEL: 'WARNING'}
#          toolCallTimeoutMs: 900000
#          failOnStartupError: false
#
#    This is not cosmetic. When the fetch fails, `failOnStartupError: false` hides
#    the error and the reconnect loop re-imports both heavy Ansys dependencies until
#    DSH's single-threaded host event loop is saturated (the desktop appears hung);
#    the plugin manager may then latch the plugin as disabled, after which the UI
#    switch no longer brings it back. Full mechanics and the unlock procedure:
#    TROUBLESHOOTING.md. Note the path is `<clone>/spaceclaim/python`, not
#    `<clone>/python` — that older form no longer applies.
#
# ── Why there is no `!!js` here ──────────────────────────────────────────────
#
# This patch used `!!js` twice, and both were removed after they broke the
# harness CLI (0.1.1-rc.1, which is what `npm i -g @deepseek-ai/dsh` gives you).
# The Desktop app (0.1.5-rc.2) accepts more than the CLI does, so a patch can
# boot on one and fail on the other:
#
#   * `createRequire(...)` — the CLI evaluates `!!js` with
#     `new Function('ctx', 'expr', 'with (ctx) { return eval(expr) }')` from a
#     module that does NOT expose `createRequire`. Result:
#     `ReferenceError: createRequire is not defined`, which is a profile that
#     will not boot.
#   * an async IIFE — the CLI's `interpolate` is synchronous and does not await
#     the returned promise. Result: `expected string but got [object Promise]`.
#
# `command: uv` needs neither: the MCP client resolves it through PATH. Set
# ANSYS_BRIDGE_UV, or override this row with a `--patch` overlay, when `uv` is
# not on the PATH the harness itself was launched with.

- insert:
    - id: mcp-ansys
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: ansys
        transport: stdio
        command: uv
        args:
          # `uv tool run` (alias `uvx`) is the subcommand that takes `--from`.
          # `uv run` does NOT: measured against uv 0.11.29 it rejects `--from`
          # with "unexpected argument", and the MCP client then reports only
          # "Connection closed" with no hint of the cause. `--quiet` keeps uv's
          # own progress off stderr; a real failure still prints.
          - 'tool'
          - 'run'
          - '--quiet'
          - '--from'
          - 'git+https://github.com/1622352030/ansys-agent-bridge#subdirectory=spaceclaim/python'
          - 'ansys-bridge-mcp'
        env:
          PYTHONIOENCODING: 'utf-8'
          ANSYS_BRIDGE_LOG_LEVEL: 'WARNING'
        # The bridge's own default is 60 s. A hidden SpaceClaim start measured
        # 14-31 s, and an export of a large assembly runs longer still, so the
        # short default would cut real calls in half.
        toolCallTimeoutMs: 900000
        failOnStartupError: false
